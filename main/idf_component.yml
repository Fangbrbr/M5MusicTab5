## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  espressif/m5stack_tab5: ^1.2.0~1
  espp/rx8130ce: ^1.1.1
  espressif/esp_tinyusb: ^2.0.0
  espressif/usb_host_hid: ^1.0.1
  espressif/esp_wifi_remote: '*'
  # esp_hosted: 由 esp_wifi_remote 间接依赖；显式钉版本避免拉 3.0.x（不兼容 IDF v5.5.5）
  espressif/esp_hosted: ~2.12.12
  # xiaozhi AI 语音助手：唤醒词（AFE+WakeNet9）、实时语音通道、Opus 编解码
  espressif/esp_websocket_client: ~1.5.0
  espressif/esp_audio_codec: ~2.5.0
  espressif/esp_audio_effects: ~1.3.0
  espressif/esp-sr: ~2.4.6
  esphome/micro-mp3: ^0.4.0
